[project]
name = "sonar"
version = "0.1.0"
description = "PoC de sonar acústico con el parlante y micrófono del computador (filtro adaptado sobre chirp casi ultrasónico)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sounddevice>=0.4.6",
    "typer>=0.12",
]

[project.scripts]
sonar = "sonar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
